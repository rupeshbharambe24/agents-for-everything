name: Bug Report
description: Report a bug in an agent, team, recipe, CLI, or core runtime
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: Agent / Package ID
      placeholder: e.g. voice/voice-form-filler or core-python
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
