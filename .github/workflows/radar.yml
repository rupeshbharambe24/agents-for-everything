name: Ecosystem Radar

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate monthly radar check
        run: python3 scripts/ecosystem_radar.py
