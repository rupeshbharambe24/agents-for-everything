<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agents for Everything — Catalog & Compatibility Explorer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Agents for Everything</h1>
      <p class="subtitle">Searchable catalog, safety tiers, eval pass rates, and schema compatibility graph</p>
    </div>
    <div id="stats" class="stats">Loading catalog...</div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="controls">
        <input id="search" type="search" placeholder="Search agents (e.g. voice, invoice, sql, pii, kyc)..." />
        <select id="family"><option value="">All Families</option></select>
        <select id="priority">
          <option value="">All Priorities</option>
          <option value="P0">P0</option>
          <option value="P1">P1</option>
        </select>
        <select id="safety">
          <option value="">All Safety Tiers</option>
          <option value="S0">S0</option>
          <option value="S1">S1</option>
          <option value="S2">S2</option>
          <option value="S3">S3</option>
          <option value="S4">S4</option>
        </select>
        <select id="maturity">
          <option value="">All Maturities</option>
          <option value="beta">beta</option>
          <option value="prototype">prototype</option>
        </select>
      </div>
      <div id="resultsCount" class="count"></div>
      <div id="agentList" class="agent-grid"></div>
    </section>

    <aside class="inspector" id="inspector">
      <h2>Compatibility & Inspector</h2>
      <p class="muted">Select any agent card to inspect its dependencies, compatible upstream/downstream edges, eval score, and CLI commands.</p>
    </aside>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
