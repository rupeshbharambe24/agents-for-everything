apiVersion: afe/v1
kind: Recipe
metadata:
  id: ai-qa-engineer
  name: AI QA Engineer
  version: 0.1.0
  maturity: prototype
  priority: P1
  tags: [qa, browser, accessibility, testing]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: Inspects a staging URL, screens pages for prompt injection, checks accessibility, and drafts bug issues.
  problem: Manual staging smoke tests miss accessibility regressions and layout errors.
  solution: Composes web-navigator, web-tester, accessibility-auditor, and issue-triager.
  agents:
    - browser/web-navigator
    - browser/web-tester
    - accessibility/accessibility-auditor
    - coding/issue-triager
  teams:
    - web-qa-team
  mcp_servers:
    - afe/browser
    - afe/issue-tracker
  entrypoint: app.py
  safety:
    level: S3
    approval_required_for: [post_issue_comment_or_labels]
  evals:
    suite: tests/test_recipe.py
