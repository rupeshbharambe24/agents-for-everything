apiVersion: afe/v1
kind: Recipe
metadata:
  id: personal-chief-of-staff
  name: Personal Chief of Staff
  version: 0.1.0
  maturity: prototype
  priority: P1
  tags: [productivity, brief, inbox, calendar, memory]
  maintainers: ["@rupeshbharambe24"]
