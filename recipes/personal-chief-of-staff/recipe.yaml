  solution: Composes daily-briefer, inbox-triager, meeting-prep, task-manager, and memory-retriever.
  agents:
    - productivity/daily-briefer
    - communication/inbox-triager
    - meetings/meeting-prep
    - productivity/task-manager
    - memory/memory-retriever
  teams:
    - chief-of-staff
  mcp_servers:
    - afe/calendar
    - afe/email
    - afe/memory-store
  entrypoint: app.py
  safety:
    level: S2
    approval_required_for: []
  evals:
    suite: tests/test_recipe.py
