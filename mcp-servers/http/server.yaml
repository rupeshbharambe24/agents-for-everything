apiVersion: afe/v1
kind: MCPServer
metadata:
  id: afe/http
  name: HTTP Fetch MCP Server
  version: 0.1.0
  license: Apache-2.0
spec:
  summary: Fetch URLs and REST/GraphQL endpoints with robots.txt and rate-limit awareness.
  transport: stdio
  upstream: modelcontextprotocol/servers (fetch)
  tools:
    - name: fetch_url
      description: Retrieve HTTP resource content safely.
      read_only: true
