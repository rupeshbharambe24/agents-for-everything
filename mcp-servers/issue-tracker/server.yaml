apiVersion: afe/v1
kind: MCPServer
metadata:
  id: afe/issue-tracker
  name: Issue Tracker MCP Server
  version: 0.1.0
  license: Apache-2.0
spec:
  summary: Read, label, deduplicate, and draft issues/PRs across GitHub, Jira, or Linear.
  transport: stdio
  upstream: github / linear / jira MCP server
  tools:
    - name: list_issues
      description: Query open issues and metadata.
      read_only: true
    - name: draft_update
      description: Prepare labels or status comments for approval.
      read_only: false
