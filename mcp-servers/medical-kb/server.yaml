apiVersion: afe/v1
kind: MCPServer
metadata:
  id: afe/medical-kb
  name: Authoritative Medical & Crisis Reference MCP Server
  version: 0.1.0
  license: Apache-2.0
spec:
  summary: Retrieve peer-reviewed clinical references, drug interaction alerts, and verified crisis helpline directories.
  transport: stdio
  upstream: medlineplus / rxnav / open-crisis-directory adapter
  tools:
    - name: lookup_drug_interaction
      description: Look up documented medication interaction notes.
      read_only: true
    - name: lookup_crisis_resources
      description: Return regional verified emergency and crisis helpline numbers.
      read_only: true
