apiVersion: afe/v1
kind: MCPServer
metadata:
  id: afe/crm
  name: CRM Operations MCP Server
  version: 0.1.0
  license: Apache-2.0
spec:
  summary: Read account records and prepare CRM updates with approval gates.
  transport: stdio
  upstream: hubspot / salesforce MCP adapter
  tools:
    - name: read_account
      description: Fetch lead/account records.
      read_only: true
    - name: stage_update
      description: Prepare CRM field updates for review.
      read_only: false
