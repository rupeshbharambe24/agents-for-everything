apiVersion: afe/v1
kind: Agent
metadata:
  id: coding/performance-optimizer
  name: "Performance Optimizer"
  version: 0.1.0
  family: builders
  category: coding
  tier: composite
  maturity: prototype
  priority: P2
  tags: ["builders", "coding", "performance"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Profiles code and optimizes hot paths with benchmarks."
  purpose: "Profiles code and optimizes hot paths with benchmarks."
  pattern: orchestrator-workers
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  audience: ["developer", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: ["afe/shell-sandbox"]
    optional: []
  uses_agents: ["coding/code-generator", "coding/code-reviewer"]
  memory: session
  safety:
    level: S2
    side_effects: ["draft-or-local-write"]
    approval_required_for: ["confirm_write"]
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
