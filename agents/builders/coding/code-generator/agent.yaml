apiVersion: afe/v1
kind: Agent
metadata:
  id: coding/code-generator
  name: "Feature Implementer"
  version: 0.1.0
  family: builders
  category: coding
  tier: composite
  maturity: prototype
  priority: P0
  tags: ["coding", "code-generator"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Implements scoped features from a spec and pairs them with unit tests."
  purpose: "Composes spec implementation and test-writer verification following repo conventions."
  pattern: augmented-llm
  autonomy: L1
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/filesystem", "afe/shell-sandbox"]
    optional: []
  uses_agents: ["coding/test-writer"]
  memory: none
  safety:
    level: S2
    side_effects: ["writes-code"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
