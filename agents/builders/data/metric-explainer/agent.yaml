apiVersion: afe/v1
kind: Agent
metadata:
  id: data/metric-explainer
  name: "Metric Explainer"
  version: 0.1.0
  family: builders
  category: data
  tier: composite
  maturity: prototype
  priority: P1
  tags: ["data", "metric-explainer"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Drills into dimension slices to explain why a KPI moved week-over-week."
  purpose: "Drills into dimension slices to explain why a KPI moved week-over-week."
  pattern: augmented-llm
  autonomy: L1
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/sql"]
    optional: []
  uses_agents: ["data/text-to-sql"]
  memory: none
  safety:
    level: S1
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
