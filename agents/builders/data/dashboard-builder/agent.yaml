apiVersion: afe/v1
kind: Agent
metadata:
  id: data/dashboard-builder
  name: "Dashboard Builder"
  version: 0.1.0
  family: builders
  category: data
  tier: composite
  maturity: prototype
  priority: P2
  tags: ["builders", "dashboard", "data"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Builds dashboards from KPI definitions (Metabase, Superset, Streamlit, HTML)."
  purpose: "Builds dashboards from KPI definitions (Metabase, Superset, Streamlit, HTML)."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["video", "vision", "text"]
  runtime: interactive
  environment: digital-api
  audience: ["professional", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use", "vision"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: ["afe/sql"]
    optional: []
  uses_agents: ["data/data-analyst"]
  memory: session
  safety:
    level: S2
    side_effects: ["draft-or-local-write"]
    approval_required_for: ["confirm_write"]
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
