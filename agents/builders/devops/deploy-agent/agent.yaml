apiVersion: afe/v1
kind: Agent
metadata:
  id: devops/deploy-agent
  name: "Release Agent"
  version: 0.1.0
  family: builders
  category: devops
  tier: composite
  maturity: prototype
  priority: P2
  tags: ["builders", "deploy", "devops"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Runs releases with canary checks and automatic rollback."
  purpose: "Runs releases with canary checks and automatic rollback."
  pattern: human-in-the-loop
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  audience: ["developer", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: ["afe/git"]
    optional: []
  uses_agents: ["devops/log-analyzer"]
  memory: session
  safety:
    level: S4
    side_effects: ["high-stakes-action-requires-human-signoff"]
    approval_required_for: ["human_officer_signoff"]
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
