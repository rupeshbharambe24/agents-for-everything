apiVersion: afe/v1
kind: Agent
metadata:
  id: ai-engineering/rag-builder
  name: "RAG Builder"
  version: 0.1.0
  family: builders
  category: ai-engineering
  tier: composite
  maturity: prototype
  priority: P1
  tags: ["ai-engineering", "rag-builder"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Configures chunking, hybrid retrieval, and reranking parameters tuned against eval recall."
  purpose: "Configures chunking, hybrid retrieval, and reranking parameters tuned against eval recall."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/vector-store", "afe/python-sandbox"]
    optional: []
  uses_agents: ["memory/knowledge-ingestor", "search/semantic-search"]
  memory: none
  safety:
    level: S2
    side_effects: ["ai-engineering-action"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
