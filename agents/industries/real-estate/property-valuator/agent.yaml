apiVersion: afe/v1
kind: Agent
metadata:
  id: real-estate/property-valuator
  name: "Property Valuation Estimator"
  version: 0.1.0
  family: industries
  category: real-estate
  tier: composite
  maturity: prototype
  priority: P2
  tags: ["industries", "property", "real-estate"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Comparable-sales based value ranges with assumptions shown."
  purpose: "Comparable-sales based value ranges with assumptions shown."
  pattern: orchestrator-workers
  autonomy: L1
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  audience: ["industry", "professional"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: ["afe/git"]
    optional: []
  uses_agents: ["documents/document-parser", "vision/ocr"]
  memory: session
  safety:
    level: S1
    side_effects: ["read-only-external-query"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
