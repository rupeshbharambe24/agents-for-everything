apiVersion: afe/v1
kind: Agent
metadata:
  id: government/rti-drafter
  name: "RTI / FOI Request Drafter"
  version: 0.1.0
  family: industries
  category: government
  tier: atomic
  maturity: prototype
  priority: P2
  tags: ["government", "industries", "on-prem", "regulated", "rti"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Drafts right-to-information requests."
  purpose: "Drafts right-to-information requests."
  pattern: augmented-llm
  autonomy: L1
  classic_type: model-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  audience: ["industry", "professional"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b", "open-weights-70b", "local-onprem"]
  tools:
    required: []
    optional: []
  memory: none
  safety:
    level: S0
    side_effects: []
    approval_required_for: []
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en", "hi", "ta", "te", "bn", "mr"]
