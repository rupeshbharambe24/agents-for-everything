apiVersion: afe/v1
kind: Agent
metadata:
  id: banking/sanctions-screener
  name: "Sanctions & PEP Screener"
  version: 0.1.0
  family: industries
  category: banking
  tier: atomic
  maturity: prototype
  priority: P1
  tags: ["banking", "sanctions-screener"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Transliteration-aware fuzzy name screening against sanctions/PEP lists with explained matches for officer review."
  purpose: "Transliteration-aware fuzzy name screening against sanctions/PEP lists with explained matches for officer review."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/policy-engine"]
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S4
    side_effects: ["banking-action"]
    approval_required_for: ["compliance_officer_clearance"]
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
