apiVersion: afe/v1
kind: Agent
metadata:
  id: gaming/npc-agent
  name: "NPC Agent"
  version: 0.1.0
  family: industries
  category: gaming
  tier: composite
  maturity: prototype
  priority: P2
  tags: ["gaming", "industries", "npc"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Dynamic non-player character dialogue with memory, personality and game-rule constraints."
  purpose: "Dynamic non-player character dialogue with memory, personality and game-rule constraints."
  pattern: orchestrator-workers
  autonomy: L1
  classic_type: goal-based
  modality: ["gui", "text"]
  runtime: interactive
  environment: digital-api
  audience: ["industry", "professional"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: []
    optional: []
  uses_agents: ["memory/memory-retriever", "memory/memory-writer"]
  memory: session
  safety:
    level: S0
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
