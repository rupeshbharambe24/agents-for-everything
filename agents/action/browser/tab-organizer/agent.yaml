apiVersion: afe/v1
kind: Agent
metadata:
  id: browser/tab-organizer
  name: "Tab & Reading Organizer"
  version: 0.1.0
  family: action
  category: browser
  tier: atomic
  maturity: prototype
  priority: P2
  tags: ["action", "browser", "tab"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Summarizes and groups open tabs, saves them to a reading list."
  purpose: "Summarizes and groups open tabs, saves them to a reading list."
  pattern: augmented-llm
  autonomy: L1
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: browser
  audience: ["professional", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: ["afe/browser"]
    optional: []
  memory: none
  safety:
    level: S1
    side_effects: ["read-only-external-query"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
