apiVersion: afe/v1
kind: Agent
metadata:
  id: browser/web-navigator
  name: "Browser Operator"
  version: 0.1.0
  family: action
  category: browser
  tier: composite
  maturity: prototype
  priority: P0
  tags: ["browser", "web-navigator"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Completes multi-step web tasks safely using accessibility trees and screenshots with injection guards."
  purpose: "Navigates web workflows step by step, screens page content for prompt injections, and stops before side effects."
  pattern: react
  autonomy: L2
  classic_type: goal-based
  modality: ["gui", "text"]
  runtime: interactive
  environment: browser
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/browser"]
    optional: []
  uses_agents: ["vision/screenshot-understander", "guardrails/prompt-injection-detector"]
  memory: none
  safety:
    level: S3
    side_effects: ["browser-interaction"]
    approval_required_for: ["submit", "purchase"]
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
