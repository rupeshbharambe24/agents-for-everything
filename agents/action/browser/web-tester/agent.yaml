apiVersion: afe/v1
kind: Agent
metadata:
  id: browser/web-tester
  name: "Web App Tester"
  version: 0.1.0
  family: action
  category: browser
  tier: composite
  maturity: prototype
  priority: P1
  tags: ["browser", "web-tester"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Walks through staging web flows, generates Playwright checks, and captures bug reports."
  purpose: "Walks through staging web flows, generates Playwright checks, and captures bug reports."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: browser
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/browser"]
    optional: []
  uses_agents: ["browser/web-navigator"]
  memory: none
  safety:
    level: S2
    side_effects: ["browser-action"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
