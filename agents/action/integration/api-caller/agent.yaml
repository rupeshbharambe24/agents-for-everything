apiVersion: afe/v1
kind: Agent
metadata:
  id: integration/api-caller
  name: "API Caller"
  version: 0.1.0
  family: action
  category: integration
  tier: atomic
  maturity: beta
  priority: P0
  tags: ["integration", "api-caller"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Prepares and invokes REST/GraphQL API requests from OpenAPI specs with approval for writes."
  purpose: "Translates structured parameters into validated HTTP requests and gates mutating methods."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/http"]
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S3
    side_effects: ["external-api-call"]
    approval_required_for: ["write_request"]
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
