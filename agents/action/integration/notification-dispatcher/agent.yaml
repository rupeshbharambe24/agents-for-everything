apiVersion: afe/v1
kind: Agent
metadata:
  id: integration/notification-dispatcher
  name: "Notification Dispatcher"
  version: 0.1.0
  family: action
  category: integration
  tier: atomic
  maturity: prototype
  priority: P1
  tags: ["integration", "notification-dispatcher"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Routes alerts to email, chat, or SMS respecting quiet hours and user approval."
  purpose: "Routes alerts to email, chat, or SMS respecting quiet hours and user approval."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/email", "afe/chat"]
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S3
    side_effects: ["integration-action"]
    approval_required_for: ["send_notification"]
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
