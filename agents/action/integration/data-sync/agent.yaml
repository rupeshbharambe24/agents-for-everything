apiVersion: afe/v1
kind: Agent
metadata:
  id: integration/data-sync
  name: "Data Sync Agent"
  version: 0.1.0
  family: action
  category: integration
  tier: atomic
  maturity: prototype
  priority: P2
  tags: ["action", "data", "integration"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Keeps records in sync between apps (CRM \u2194 sheet \u2194 database) and resolves conflicts."
  purpose: "Keeps records in sync between apps (CRM \u2194 sheet \u2194 database) and resolves conflicts."
  pattern: human-in-the-loop
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  audience: ["developer", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: ["afe/http"]
    optional: []
  memory: none
  safety:
    level: S3
    side_effects: ["external-action-requires-approval"]
    approval_required_for: ["approve_external_action"]
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
