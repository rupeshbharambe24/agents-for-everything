apiVersion: afe/v1
kind: Agent
metadata:
  id: physical/smart-home-controller
  name: "Smart Home Controller"
  version: 0.1.0
  family: action
  category: physical
  tier: composite
  maturity: prototype
  priority: P1
  tags: ["physical", "smart-home-controller"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Controls lights, climate, and locks via Home Assistant/Matter with confirmation on security devices."
  purpose: "Controls lights, climate, and locks via Home Assistant/Matter with confirmation on security devices."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["voice", "text"]
  runtime: interactive
  environment: physical
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/home-automation"]
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S3
    side_effects: ["physical-action"]
    approval_required_for: ["control_security_device"]
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
