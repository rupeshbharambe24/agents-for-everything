apiVersion: afe/v1
kind: Agent
metadata:
  id: physical/vehicle-diagnostics
  name: "Vehicle Diagnostics"
  version: 0.1.0
  family: action
  category: physical
  tier: atomic
  maturity: prototype
  priority: P2
  tags: ["action", "physical", "vehicle"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Explains OBD-II fault codes, likely causes and urgency."
  purpose: "Explains OBD-II fault codes, likely causes and urgency."
  pattern: augmented-llm
  autonomy: L1
  classic_type: model-based
  modality: ["physical", "api"]
  runtime: interactive
  environment: physical
  audience: ["professional", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: []
    optional: []
  memory: none
  safety:
    level: S0
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
