apiVersion: afe/v1
kind: Agent
metadata:
  id: computer-use/app-automator
  name: "App Automator"
  version: 0.1.0
  family: action
  category: computer-use
  tier: atomic
  maturity: prototype
  priority: P1
  tags: ["computer-use", "app-automator"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Automates desktop apps cleanly using OS accessibility APIs (AppleScript, UI Automation, AT-SPI)."
  purpose: "Automates desktop apps cleanly using OS accessibility APIs (AppleScript, UI Automation, AT-SPI)."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: desktop
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/shell-sandbox"]
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S3
    side_effects: ["computer-use-action"]
    approval_required_for: ["execute_app_script"]
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
