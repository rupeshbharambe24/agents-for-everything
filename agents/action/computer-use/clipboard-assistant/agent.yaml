apiVersion: afe/v1
kind: Agent
metadata:
  id: computer-use/clipboard-assistant
  name: "Clipboard Transformer"
  version: 0.1.0
  family: action
  category: computer-use
  tier: atomic
  maturity: prototype
  priority: P2
  tags: ["action", "clipboard", "computer-use"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Transforms whatever is copied (reformat, translate, extract, clean)."
  purpose: "Transforms whatever is copied (reformat, translate, extract, clean)."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["video", "vision", "text"]
  runtime: interactive
  environment: desktop
  audience: ["professional", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use", "vision"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: ["afe/shell-sandbox"]
    optional: []
  memory: none
  safety:
    level: S2
    side_effects: ["draft-or-local-write"]
    approval_required_for: ["confirm_write"]
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
