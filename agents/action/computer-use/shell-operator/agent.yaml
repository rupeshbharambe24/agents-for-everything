apiVersion: afe/v1
kind: Agent
metadata:
  id: computer-use/shell-operator
  name: "Shell Operator"
  version: 0.1.0
  family: action
  category: computer-use
  tier: atomic
  maturity: prototype
  priority: P0
  tags: ["computer-use", "shell-operator"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Prepares and runs scoped terminal commands in a sandbox, requiring approval for state changes."
  purpose: "Translates operational intents into safe terminal commands with explainability and approval gating."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: desktop
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/shell-sandbox"]
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S3
    side_effects: ["runs-shell-command"]
    approval_required_for: ["execute_command", "execute_destructive"]
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
