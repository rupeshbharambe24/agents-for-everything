apiVersion: afe/v1
kind: Agent
metadata:
  id: documents/file-organizer
  name: "File Organizer"
  version: 0.1.0
  family: action
  category: documents
  tier: atomic
  maturity: beta
  priority: P0
  tags: ["documents", "file-organizer"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Classifies files by extension/topic and produces a dry-run move plan before touching disk."
  purpose: "Turns messy directories into clean category folders with explicit preview/approval before moving."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/filesystem"]
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S2
    side_effects: ["plans-file-moves"]
    approval_required_for: ["apply_moves"]
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
