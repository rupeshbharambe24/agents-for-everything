apiVersion: afe/v1
kind: Agent
metadata:
  id: documents/duplicate-finder
  name: "Duplicate Finder"
  version: 0.1.0
  family: action
  category: documents
  tier: atomic
  maturity: prototype
  priority: P2
  tags: ["action", "documents", "duplicate"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Finds duplicate and near-duplicate files and photos and proposes cleanup."
  purpose: "Finds duplicate and near-duplicate files and photos and proposes cleanup."
  pattern: augmented-llm
  autonomy: L1
  classic_type: goal-based
  modality: ["vision", "text"]
  runtime: interactive
  environment: digital-api
  audience: ["professional", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use", "vision"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: ["afe/filesystem"]
    optional: []
  memory: none
  safety:
    level: S1
    side_effects: ["read-only-external-query"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
