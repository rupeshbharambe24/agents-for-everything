apiVersion: afe/v1
kind: Agent
metadata:
  id: documents/slide-deck-builder
  name: "Slide Deck Builder"
  version: 0.1.0
  family: action
  category: documents
  tier: composite
  maturity: prototype
  priority: P1
  tags: ["documents", "slide-deck-builder"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Transforms outlines or reports into structured presentation slides and speaker notes."
  purpose: "Transforms outlines or reports into structured presentation slides and speaker notes."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/documents"]
    optional: []
  uses_agents: ["text/summarizer"]
  memory: none
  safety:
    level: S2
    side_effects: ["documents-action"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
