apiVersion: afe/v1
kind: Agent
metadata:
  id: support/customer-onboarding-guide
  name: "Customer Onboarding Guide"
  version: 0.1.0
  family: business
  category: support
  tier: composite
  maturity: prototype
  priority: P2
  tags: ["business", "customer", "support"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Guides new customers through setup with in-app tips and check-ins."
  purpose: "Guides new customers through setup with in-app tips and check-ins."
  pattern: orchestrator-workers
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  audience: ["professional", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: ["afe/git"]
    optional: []
  uses_agents: ["support/ticket-triager", "search/rag-qa"]
  memory: session
  safety:
    level: S2
    side_effects: ["draft-or-local-write"]
    approval_required_for: ["confirm_write"]
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
