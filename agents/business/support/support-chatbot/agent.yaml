apiVersion: afe/v1
kind: Agent
metadata:
  id: support/support-chatbot
  name: "Support Assistant"
  version: 0.1.0
  family: business
  category: support
  tier: composite
  maturity: prototype
  priority: P0
  tags: ["support", "support-chatbot"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Answers customer questions from KB docs with citations and flags handoffs when uncertain."
  purpose: "Composes RAG Q&A to resolve tier-1 support inquiries accurately without hallucinating policies."
  pattern: augmented-llm
  autonomy: L1
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/vector-store"]
    optional: []
  uses_agents: ["search/rag-qa"]
  memory: none
  safety:
    level: S1
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
