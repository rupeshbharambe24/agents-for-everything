apiVersion: afe/v1
kind: Agent
metadata:
  id: support/reply-drafter
  name: "Reply Drafter"
  version: 0.1.0
  family: business
  category: support
  tier: composite
  maturity: prototype
  priority: P0
  tags: ["support", "reply-drafter"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Drafts KB-grounded support replies for human agents to review and send."
  purpose: "Uses RAG Q&A over help docs to assemble polite, accurate draft replies."
  pattern: augmented-llm
  autonomy: L1
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/vector-store"]
    optional: []
  uses_agents: ["search/rag-qa"]
  memory: none
  safety:
    level: S2
    side_effects: ["saves-reply-draft"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
