apiVersion: afe/v1
kind: Agent
metadata:
  id: sales/rfp-responder
  name: "RFP & Questionnaire Responder"
  version: 0.1.0
  family: business
  category: sales
  tier: composite
  maturity: prototype
  priority: P1
  tags: ["sales", "rfp-responder"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Drafts answers to RFPs and security questionnaires from an approved KB, flagging gaps."
  purpose: "Drafts answers to RFPs and security questionnaires from an approved KB, flagging gaps."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: []
    optional: []
  uses_agents: ["search/rag-qa"]
  memory: none
  safety:
    level: S2
    side_effects: ["sales-action"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
