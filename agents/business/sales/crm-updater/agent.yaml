apiVersion: afe/v1
kind: Agent
metadata:
  id: sales/crm-updater
  name: "CRM Updater"
  version: 0.1.0
  family: business
  category: sales
  tier: atomic
  maturity: prototype
  priority: P1
  tags: ["sales", "crm-updater"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Extracts call/meeting takeaways into structured CRM field updates gated by approval."
  purpose: "Extracts call/meeting takeaways into structured CRM field updates gated by approval."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/crm"]
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S3
    side_effects: ["sales-action"]
    approval_required_for: ["commit_crm_update"]
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
