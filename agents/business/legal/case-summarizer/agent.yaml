apiVersion: afe/v1
kind: Agent
metadata:
  id: legal/case-summarizer
  name: "Judgment Summarizer"
  version: 0.1.0
  family: business
  category: legal
  tier: atomic
  maturity: prototype
  priority: P2
  tags: ["business", "case", "legal", "on-prem", "regulated"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Summarizes judgments into facts, issues, holdings and reasoning."
  purpose: "Summarizes judgments into facts, issues, holdings and reasoning."
  pattern: augmented-llm
  autonomy: L1
  classic_type: model-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  audience: ["professional", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b", "open-weights-70b", "local-onprem"]
  tools:
    required: []
    optional: []
  memory: none
  safety:
    level: S0
    side_effects: []
    approval_required_for: []
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
