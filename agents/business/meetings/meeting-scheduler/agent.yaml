apiVersion: afe/v1
kind: Agent
metadata:
  id: meetings/meeting-scheduler
  name: "Meeting Scheduler"
  version: 0.1.0
  family: business
  category: meetings
  tier: composite
  maturity: prototype
  priority: P0
  tags: ["meetings", "meeting-scheduler"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Finds conflict-free meeting slots across calendars and prepares invites for approval."
  purpose: "Coordinates free/busy windows across participants and drafts calendar invites safely."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/calendar", "afe/email"]
    optional: []
  uses_agents: ["communication/email-drafter"]
  memory: none
  safety:
    level: S3
    side_effects: ["creates-calendar-invite"]
    approval_required_for: ["send_invite"]
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
