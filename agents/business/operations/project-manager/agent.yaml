apiVersion: afe/v1
kind: Agent
metadata:
  id: operations/project-manager
  name: "Project Manager"
  version: 0.1.0
  family: business
  category: operations
  tier: composite
  maturity: prototype
  priority: P1
  tags: ["operations", "project-manager"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Builds milestone plans, tracks task progress, and surfaces schedule slippage risks."
  purpose: "Builds milestone plans, tracks task progress, and surfaces schedule slippage risks."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/issue-tracker"]
    optional: []
  uses_agents: ["orchestration/task-planner"]
  memory: none
  safety:
    level: S2
    side_effects: ["operations-action"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
