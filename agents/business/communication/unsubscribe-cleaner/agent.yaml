apiVersion: afe/v1
kind: Agent
metadata:
  id: communication/unsubscribe-cleaner
  name: "Unsubscribe Cleaner"
  version: 0.1.0
  family: business
  category: communication
  tier: atomic
  maturity: prototype
  priority: P2
  tags: ["business", "communication", "unsubscribe"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Finds unwanted mailing lists and unsubscribes after the user approves the list."
  purpose: "Finds unwanted mailing lists and unsubscribes after the user approves the list."
  pattern: human-in-the-loop
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: browser
  audience: ["professional", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: ["afe/browser", "afe/email"]
    optional: []
  memory: none
  safety:
    level: S3
    side_effects: ["external-action-requires-approval"]
    approval_required_for: ["approve_external_action"]
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
