apiVersion: afe/v1
kind: Agent
metadata:
  id: finance/accounts-receivable
  name: "Collections Assistant"
  version: 0.1.0
  family: business
  category: finance
  tier: composite
  maturity: prototype
  priority: P2
  tags: ["accounts", "business", "finance", "on-prem", "regulated"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Drafts polite payment reminders and tracks promises to pay."
  purpose: "Drafts polite payment reminders and tracks promises to pay."
  pattern: orchestrator-workers
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: scheduled
  environment: digital-api
  audience: ["professional", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b", "open-weights-70b", "local-onprem"]
  tools:
    required: ["afe/email"]
    optional: []
  uses_agents: ["documents/invoice-receipt-parser", "finance/financial-statement-analyzer"]
  memory: session
  safety:
    level: S3
    side_effects: ["external-action-requires-approval"]
    approval_required_for: ["approve_external_action"]
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
