apiVersion: afe/v1
kind: Agent
metadata:
  id: finance/accounts-payable
  name: "Accounts Payable Agent"
  version: 0.1.0
  family: business
  category: finance
  tier: composite
  maturity: prototype
  priority: P1
  tags: ["finance", "accounts-payable"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Matches parsed invoices against PO/receipt totals and prepares an approval queue (no autonomous payment)."
  purpose: "Matches parsed invoices against PO/receipt totals and prepares an approval queue (no autonomous payment)."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/accounting"]
    optional: []
  uses_agents: ["documents/invoice-receipt-parser"]
  memory: none
  safety:
    level: S4
    side_effects: ["finance-action"]
    approval_required_for: ["approve_payment_batch"]
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
