apiVersion: afe/v1
kind: Agent
metadata:
  id: orchestration/supervisor
  name: "Supervisor / Orchestrator"
  version: 0.1.0
  family: core
  category: orchestration
  tier: composite
  maturity: prototype
  priority: P0
  tags: ["orchestration", "supervisor"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Executes a plan by delegating steps to worker agents, tracks state, and re-plans when a step fails."
  purpose: "Coordinates multi-step agent execution across atomic workers declared in uses_agents."
  pattern: orchestrator-workers
  autonomy: L3
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: []
    optional: []
  uses_agents: ["orchestration/task-planner", "orchestration/router", "orchestration/verifier"]
  memory: session
  safety:
    level: S1
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.02
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
