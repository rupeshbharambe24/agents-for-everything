apiVersion: afe/v1
kind: Agent
metadata:
  id: evaluation/llm-judge
  name: "LLM Judge"
  version: 0.1.0
  family: core
  category: evaluation
  tier: atomic
  maturity: prototype
  priority: P0
  tags: ["evaluation", "llm-judge"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Scores outputs against a rubric with calibrated, explained verdicts."
  purpose: "Evaluates agent outputs during CI regressions, prompt optimization, and quality gates."
  pattern: evaluator-optimizer
  autonomy: L1
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: []
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S0
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.02
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
