apiVersion: afe/v1
kind: Agent
metadata:
  id: guardrails/pii-redactor
  name: "PII Redactor"
  version: 0.1.0
  family: core
  category: guardrails
  tier: atomic
  maturity: prototype
  priority: P0
  tags: ["guardrails", "pii-redactor"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Detects and masks personal data (emails, phones, Aadhaar, PAN, SSN, card numbers) reversibly."
  purpose: "Protects privacy before prompts leave trust boundaries or enter logs/traces."
  pattern: augmented-llm
  autonomy: L1
  classic_type: simple-reflex
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: []
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S0
    side_effects: []
    approval_required_for: []
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.02
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
