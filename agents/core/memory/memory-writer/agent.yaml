apiVersion: afe/v1
kind: Agent
metadata:
  id: memory/memory-writer
  name: "Memory Writer"
  version: 0.1.0
  family: core
  category: memory
  tier: atomic
  maturity: beta
  priority: P0
  tags: ["memory", "memory-writer"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Extracts durable user preferences, facts, and decisions without creating duplicates."
  purpose: "Filters ephemeral noise and writes clean deduplicated memory records with consent."
  pattern: augmented-llm
  autonomy: L2
  classic_type: learning
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: []
    optional: []
  uses_agents: []
  memory: long-term
  safety:
    level: S2
    side_effects: ["writes-memory-store"]
    approval_required_for: []
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.02
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
