apiVersion: afe/v1
kind: Agent
metadata:
  id: memory/session-summarizer
  name: "Session Summarizer"
  version: 0.1.0
  family: core
  category: memory
  tier: atomic
  maturity: prototype
  priority: P1
  tags: ["memory", "session-summarizer"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Writes end-of-session summaries and open follow-up items so the next session resumes cleanly."
  purpose: "Writes end-of-session summaries and open follow-up items so the next session resumes cleanly."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/memory-store"]
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S2
    side_effects: ["memory-action"]
    approval_required_for: []
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
