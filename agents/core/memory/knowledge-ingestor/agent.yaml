apiVersion: afe/v1
kind: Agent
metadata:
  id: memory/knowledge-ingestor
  name: "Knowledge Ingestor"
  version: 0.1.0
  family: core
  category: memory
  tier: atomic
  maturity: beta
  priority: P0
  tags: ["memory", "knowledge-ingestor"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Parses, chunks, and prepares documents for hybrid keyword + vector indexing with metadata."
  purpose: "Splits raw documents into deterministic overlapping chunks with provenance IDs for RAG agents."
  pattern: prompt-chaining
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/vector-store", "afe/documents"]
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S2
    side_effects: ["writes-vector-index"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.02
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
