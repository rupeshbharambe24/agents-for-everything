apiVersion: afe/v1
kind: Agent
metadata:
  id: voice/phone-call-agent
  name: "Phone Call Agent"
  version: 0.1.0
  family: perception
  category: voice
  tier: composite
  maturity: prototype
  priority: P1
  tags: ["voice", "phone-call-agent"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Inbound/outbound telephony assistant for bookings and reminders with mandatory AI disclosure."
  purpose: "Inbound/outbound telephony assistant for bookings and reminders with mandatory AI disclosure."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["voice"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/telephony", "afe/stt", "afe/tts"]
    optional: []
  uses_agents: ["voice/speech-to-text", "voice/text-to-speech"]
  memory: none
  safety:
    level: S3
    side_effects: ["voice-action"]
    approval_required_for: ["place_or_answer_call"]
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
