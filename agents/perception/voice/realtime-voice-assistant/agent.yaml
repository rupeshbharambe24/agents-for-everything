apiVersion: afe/v1
kind: Agent
metadata:
  id: voice/realtime-voice-assistant
  name: "Real-time Voice Assistant"
  version: 0.1.0
  family: perception
  category: voice
  tier: composite
  maturity: prototype
  priority: P0
  tags: ["voice", "realtime-voice-assistant"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Full-duplex speech assistant with low latency, interruption handling, and tool dispatch."
  purpose: "Coordinates STT, command parsing, and TTS output in interactive voice sessions."
  pattern: handoff
  autonomy: L2
  classic_type: goal-based
  modality: ["voice"]
  runtime: streaming
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/stt", "afe/tts"]
    optional: []
  uses_agents: ["voice/speech-to-text", "voice/voice-command", "voice/text-to-speech"]
  memory: session
  safety:
    level: S1
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
