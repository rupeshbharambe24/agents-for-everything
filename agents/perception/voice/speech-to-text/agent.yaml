apiVersion: afe/v1
kind: Agent
metadata:
  id: voice/speech-to-text
  name: "Transcriber"
  version: 0.1.0
  family: perception
  category: voice
  tier: atomic
  maturity: beta
  priority: P0
  tags: ["voice", "speech-to-text"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Batch or streaming speech recognition with punctuation, language detection, and code-switching."
  purpose: "Converts audio streams or files into clean Transcript JSON across English and Indic/global languages."
  pattern: augmented-llm
  autonomy: L1
  classic_type: goal-based
  modality: ["voice", "text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/stt"]
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S1
    side_effects: []
    approval_required_for: []
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en", "hi", "ta", "te", "bn", "mr", "es", "fr", "ar"]
