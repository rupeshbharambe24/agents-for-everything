apiVersion: afe/v1
kind: Agent
metadata:
  id: audio/audiobook-producer
  name: "Audiobook Producer"
  version: 0.1.0
  family: perception
  category: audio
  tier: composite
  maturity: prototype
  priority: P2
  tags: ["audio", "audiobook", "perception"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Turns a manuscript into a multi-voice audiobook with chapter files."
  purpose: "Turns a manuscript into a multi-voice audiobook with chapter files."
  pattern: orchestrator-workers
  autonomy: L1
  classic_type: goal-based
  modality: ["voice", "text"]
  runtime: interactive
  environment: digital-api
  audience: ["professional", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: []
    optional: []
  uses_agents: ["voice/text-to-speech", "voice/speech-to-text"]
  memory: session
  safety:
    level: S0
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
