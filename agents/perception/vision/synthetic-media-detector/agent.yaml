apiVersion: afe/v1
kind: Agent
metadata:
  id: vision/synthetic-media-detector
  name: "AI-Image Detector"
  version: 0.1.0
  family: perception
  category: vision
  tier: atomic
  maturity: prototype
  priority: P2
  tags: ["perception", "synthetic", "vision"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Estimates whether an image was AI-generated or manipulated, with evidence."
  purpose: "Estimates whether an image was AI-generated or manipulated, with evidence."
  pattern: augmented-llm
  autonomy: L1
  classic_type: model-based
  modality: ["vision", "text"]
  runtime: interactive
  environment: digital-api
  audience: ["professional", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "vision"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: []
    optional: []
  memory: none
  safety:
    level: S0
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
