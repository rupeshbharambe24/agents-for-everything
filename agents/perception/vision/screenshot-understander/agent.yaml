apiVersion: afe/v1
kind: Agent
metadata:
  id: vision/screenshot-understander
  name: "Screen Parser"
  version: 0.1.0
  family: perception
  category: vision
  tier: atomic
  maturity: prototype
  priority: P0
  tags: ["vision", "screenshot-understander"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Converts UI screenshots into a structured tree of buttons, inputs, and coordinates."
  purpose: "Gives desktop and browser agents a structured element map from screen pixels."
  pattern: augmented-llm
  autonomy: L1
  classic_type: goal-based
  modality: ["vision", "gui"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["vision", "structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: []
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S1
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
