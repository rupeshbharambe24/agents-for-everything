apiVersion: afe/v1
kind: Agent
metadata:
  id: video/video-summarizer
  name: "Video Summarizer"
  version: 0.1.0
  family: perception
  category: video
  tier: composite
  maturity: prototype
  priority: P1
  tags: ["video", "video-summarizer"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Summarizes long videos into timestamped chapters and key takeaways."
  purpose: "Summarizes long videos into timestamped chapters and key takeaways."
  pattern: augmented-llm
  autonomy: L1
  classic_type: goal-based
  modality: ["video", "text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/stt"]
    optional: []
  uses_agents: ["voice/speech-to-text", "text/summarizer"]
  memory: none
  safety:
    level: S1
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
