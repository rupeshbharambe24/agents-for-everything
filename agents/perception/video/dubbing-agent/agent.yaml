apiVersion: afe/v1
kind: Agent
metadata:
  id: video/dubbing-agent
  name: "Dubbing Agent"
  version: 0.1.0
  family: perception
  category: video
  tier: composite
  maturity: prototype
  priority: P2
  tags: ["dubbing", "perception", "video"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Translates and re-voices video, optionally with lip-sync."
  purpose: "Translates and re-voices video, optionally with lip-sync."
  pattern: orchestrator-workers
  autonomy: L1
  classic_type: goal-based
  modality: ["voice", "text"]
  runtime: interactive
  environment: digital-api
  audience: ["professional", "enterprise"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: ["afe/stt", "afe/tts"]
    optional: []
  uses_agents: ["text/translator", "voice/speech-to-text", "voice/text-to-speech"]
  memory: session
  safety:
    level: S1
    side_effects: ["read-only-external-query"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
