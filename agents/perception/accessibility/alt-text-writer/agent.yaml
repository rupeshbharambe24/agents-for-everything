apiVersion: afe/v1
kind: Agent
metadata:
  id: accessibility/alt-text-writer
  name: "Alt-Text Writer"
  version: 0.1.0
  family: perception
  category: accessibility
  tier: atomic
  maturity: prototype
  priority: P1
  tags: ["accessibility", "alt-text-writer"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Writes concise, context-aware alt text for images on websites and documents."
  purpose: "Writes concise, context-aware alt text for images on websites and documents."
  pattern: augmented-llm
  autonomy: L1
  classic_type: goal-based
  modality: ["vision", "text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: []
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S0
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
