apiVersion: afe/v1
kind: Agent
metadata:
  id: accessibility/voice-control-navigator
  name: "Voice Control Navigator"
  version: 0.1.0
  family: perception
  category: accessibility
  tier: composite
  maturity: prototype
  priority: P2
  tags: ["accessibility", "perception", "voice"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Hands-free control of apps and the OS by voice."
  purpose: "Hands-free control of apps and the OS by voice."
  pattern: orchestrator-workers
  autonomy: L2
  classic_type: goal-based
  modality: ["voice", "text"]
  runtime: interactive
  environment: desktop
  audience: ["consumer", "professional"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: ["afe/stt"]
    optional: []
  uses_agents: ["voice/speech-to-text", "computer-use/desktop-operator"]
  memory: session
  safety:
    level: S3
    side_effects: ["external-action-requires-approval"]
    approval_required_for: ["approve_external_action"]
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en", "hi", "ta", "te", "bn", "mr"]
