apiVersion: afe/v1
kind: Agent
metadata:
  id: accessibility/screen-narrator
  name: "Screen Narrator"
  version: 0.1.0
  family: perception
  category: accessibility
  tier: composite
  maturity: prototype
  priority: P1
  tags: ["accessibility", "screen-narrator"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Describes active UI screens aloud for blind and low-vision navigation."
  purpose: "Describes active UI screens aloud for blind and low-vision navigation."
  pattern: augmented-llm
  autonomy: L2
  classic_type: goal-based
  modality: ["vision", "voice"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/tts"]
    optional: []
  uses_agents: ["vision/screenshot-understander", "voice/text-to-speech"]
  memory: none
  safety:
    level: S2
    side_effects: ["accessibility-action"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
