apiVersion: afe/v1
kind: Agent
metadata:
  id: text/structured-extractor
  name: "Structured Extractor"
  version: 0.1.0
  family: information
  category: text
  tier: atomic
  maturity: beta
  priority: P0
  tags: ["text", "structured-extractor"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Turns unstructured text or speech transcripts into normalized JSON matching a target schema."
  purpose: "Extracts names, ISO dates, PIN codes, emails, phones, and multilingual numbers (e.g. 'pachas hazaar' -> 50000) into typed fields."
  pattern: augmented-llm
  autonomy: L1
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: []
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S0
    side_effects: []
    approval_required_for: []
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en", "hi", "ta", "te", "bn", "mr"]
