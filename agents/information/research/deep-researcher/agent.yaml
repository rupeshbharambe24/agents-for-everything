apiVersion: afe/v1
kind: Agent
metadata:
  id: research/deep-researcher
  name: "Deep Researcher"
  version: 0.1.0
  family: information
  category: research
  tier: composite
  maturity: beta
  priority: P0
  tags: ["research", "deep-researcher"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Plans research questions, searches iteratively, reads sources, fact-checks, and writes a cited report."
  purpose: "End-to-end composite research orchestrator combining search, reading, fact-checking, and report writing."
  pattern: orchestrator-workers
  autonomy: L2
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/web-search", "afe/http", "afe/documents"]
    optional: []
  uses_agents: ["search/web-search", "research/source-reader", "research/fact-checker", "research/report-writer"]
  memory: session
  safety:
    level: S1
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
