apiVersion: afe/v1
kind: Agent
metadata:
  id: creative/meme-generator
  name: "Meme Generator"
  version: 0.1.0
  family: life
  category: creative
  tier: atomic
  maturity: prototype
  priority: P2
  tags: ["creative", "life", "meme"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Meme and reaction images from a topic."
  purpose: "Meme and reaction images from a topic."
  pattern: augmented-llm
  autonomy: L1
  classic_type: model-based
  modality: ["vision", "text"]
  runtime: interactive
  environment: digital-api
  audience: ["consumer", "professional"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "vision"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b"]
  tools:
    required: []
    optional: []
  memory: none
  safety:
    level: S0
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
