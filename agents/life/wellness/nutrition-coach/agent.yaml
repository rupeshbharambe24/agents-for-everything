apiVersion: afe/v1
kind: Agent
metadata:
  id: wellness/nutrition-coach
  name: "Nutrition Coach"
  version: 0.1.0
  family: life
  category: wellness
  tier: composite
  maturity: prototype
  priority: P2
  tags: ["life", "nutrition", "on-prem", "regulated", "wellness"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Food logging from photos and nutrition guidance."
  purpose: "Food logging from photos and nutrition guidance."
  pattern: orchestrator-workers
  autonomy: L1
  classic_type: goal-based
  modality: ["vision", "text"]
  runtime: interactive
  environment: digital-api
  audience: ["consumer", "professional"]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output", "tool_use", "vision"]
    min_context_tokens: 8000
    tested_with: ["frontier-large", "frontier-small", "open-weights-8b", "open-weights-70b", "local-onprem"]
  tools:
    required: ["afe/medical-kb"]
    optional: []
  uses_agents: ["documents/document-parser", "text/summarizer"]
  memory: session
  safety:
    level: S1
    side_effects: ["read-only-external-query"]
    approval_required_for: []
    handles_pii: true
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
