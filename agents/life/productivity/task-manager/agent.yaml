apiVersion: afe/v1
kind: Agent
metadata:
  id: productivity/task-manager
  name: "Task Manager"
  version: 0.1.0
  family: life
  category: productivity
  tier: composite
  maturity: prototype
  priority: P0
  tags: ["productivity", "task-manager"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Captures tasks from notes, chat, or voice, prioritizes them, and structures a daily plan."
  purpose: "Composes action-item-extractor to prioritize tasks into actionable daily focus lists."
  pattern: augmented-llm
  autonomy: L1
  classic_type: goal-based
  modality: ["text"]
  runtime: interactive
  environment: digital-api
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: ["structured_output"]
    min_context_tokens: 8000
    tested_with: [frontier-large, frontier-small, open-weights-8b]
  tools:
    required: ["afe/calendar"]
    optional: []
  uses_agents: ["meetings/action-item-extractor"]
  memory: none
  safety:
    level: S2
    side_effects: ["updates-task-list"]
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 10
    timeout_seconds: 60
    max_cost_usd: 0.03
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: ["en"]
