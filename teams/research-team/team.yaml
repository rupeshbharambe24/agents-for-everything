apiVersion: afe/v1
kind: Team
metadata:
  id: research-team
  name: Research Team
  version: 0.1.0
  maturity: prototype
  priority: P0
  tags: [research, citations, verification]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: Produces a cited, grounding-verified research report on any topic.
  pattern: orchestrator-workers
  entry: orchestration/task-planner
  members:
    - orchestration/task-planner
    - search/web-search
    - research/source-reader
    - research/fact-checker
    - research/report-writer
    - guardrails/hallucination-checker
  graph:
    - [task-planner, web-search]
    - [web-search, source-reader]
    - [source-reader, fact-checker]
    - [fact-checker, report-writer]
    - [report-writer, hallucination-checker]
  approvals: []
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  safety:
    level: S1
  evals:
    suite: evals/eval.yaml
