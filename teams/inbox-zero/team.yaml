apiVersion: afe/v1
kind: Team
metadata:
  id: inbox-zero
  name: Inbox Zero Team
  version: 0.1.0
  maturity: prototype
  priority: P0
  tags: [email, triage, productivity]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: Triages inbox emails, drafts replies, extracts action items, and waits for human approval.
  pattern: prompt-chaining
  entry: communication/inbox-triager
  members:
    - communication/inbox-triager
    - communication/email-drafter
    - meetings/action-item-extractor
    - orchestration/human-approval-gate
  graph:
    - [inbox-triager, email-drafter]
    - [email-drafter, action-item-extractor]
    - [action-item-extractor, human-approval-gate]
  approvals: [human-approval-gate]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  safety:
    level: S2
  evals:
    suite: evals/eval.yaml
