apiVersion: afe/v1
kind: Team
metadata:
  id: content-studio
  name: Content Studio Team
  version: 0.1.0
  maturity: prototype
  priority: P1
  tags: ["content", "studio"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Turns a target topic into keyword-researched, edited, SEO-checked, multi-channel content."
  pattern: prompt-chaining
  entry: marketing/keyword-researcher
  members:
    - marketing/keyword-researcher
    - content/blog-writer
    - content/editor
    - content/seo-optimizer
    - content/content-repurposer
    - content/social-post-writer
  graph:
    - [keyword-researcher, blog-writer]
    - [blog-writer, editor]
    - [editor, seo-optimizer]
    - [seo-optimizer, content-repurposer]
    - [content-repurposer, social-post-writer]
  approvals: []
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  safety:
    level: S1
  evals:
    suite: evals/eval.yaml
