apiVersion: afe/v1
kind: Team
metadata:
  id: voice-concierge
  name: Voice Concierge Team
  version: 0.1.0
  maturity: prototype
  priority: P0
  tags: [voice, routing, tts]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: Voice in, intent routing and action execution, and spoken response out.
  pattern: routing
  entry: voice/speech-to-text
  members:
    - voice/speech-to-text
    - orchestration/router
    - voice/voice-command
    - voice/text-to-speech
  graph:
    - [speech-to-text, router]
    - [router, voice-command]
    - [voice-command, text-to-speech]
  approvals: []
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  safety:
    level: S1
  evals:
    suite: evals/eval.yaml
