apiVersion: afe/v1
kind: Team
metadata:
  id: document-intake
  name: Document Intake Team
  version: 0.1.0
  maturity: prototype
  priority: P0
  tags: [documents, extraction, verification]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: Turns incoming raw documents into validated, human-approved structured records.
  pattern: prompt-chaining
  entry: documents/document-parser
  members:
    - documents/document-parser
    - text/structured-extractor
    - orchestration/verifier
    - orchestration/human-approval-gate
  graph:
    - [document-parser, structured-extractor]
    - [structured-extractor, verifier]
    - [verifier, human-approval-gate]
  approvals: [human-approval-gate]
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  safety:
    level: S2
  evals:
    suite: evals/eval.yaml
