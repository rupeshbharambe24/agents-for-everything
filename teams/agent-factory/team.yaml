apiVersion: afe/v1
kind: Team
metadata:
  id: agent-factory
  name: Agent Factory Team
  version: 0.1.0
  maturity: prototype
  priority: P1
  tags: ["agent", "factory"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "Scaffolds new agents, generates eval suites, runs regressions, red-teams prompts, and grades quality."
  pattern: evaluator-optimizer
  entry: orchestration/agent-builder
  members:
    - orchestration/agent-builder
    - evaluation/test-case-generator
    - evaluation/regression-runner
    - guardrails/red-teamer
    - evaluation/llm-judge
  graph:
    - [agent-builder, test-case-generator]
    - [test-case-generator, regression-runner]
    - [regression-runner, red-teamer]
    - [red-teamer, llm-judge]
  approvals: []
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  safety:
    level: S2
  evals:
    suite: evals/eval.yaml
