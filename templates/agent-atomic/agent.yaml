apiVersion: afe/v1
kind: Agent
metadata:
  id: "{{category}}/{{slug}}"
  name: "{{name}}"
  version: 0.1.0
  family: "{{family}}"
  category: "{{category}}"
  tier: atomic
  maturity: spec
  priority: P1
  tags: ["{{category}}"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "{{summary}}"
  purpose: "{{summary}}"
  pattern: augmented-llm
  autonomy: L1
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: [structured_output]
    min_context_tokens: 8000
    tested_with: [frontier-small, open-weights-8b]
  tools:
    required: []
    optional: []
  uses_agents: []
  memory: none
  safety:
    level: S0
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 5
    timeout_seconds: 60
    max_cost_usd: 0.02
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: [en]
