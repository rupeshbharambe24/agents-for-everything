apiVersion: afe/v1
kind: Agent
metadata:
  id: "{{category}}/{{slug}}"
  name: "{{name}}"
  version: 0.1.0
  family: "{{family}}"
  category: "{{category}}"
  tier: composite
  maturity: spec
  priority: P1
  tags: ["{{category}}", "composite"]
  maintainers: ["@rupeshbharambe24"]
  license: Apache-2.0
spec:
  summary: "{{summary}}"
  purpose: "{{summary}}"
  pattern: plan-and-execute
  autonomy: L2
  io:
    input: schemas/input.schema.json
    output: schemas/output.schema.json
  model:
    capabilities: [tool_use, structured_output]
    min_context_tokens: 16000
    tested_with: [frontier-large, frontier-small]
  tools:
    required: []
    optional: []
  uses_agents: []
  memory: session
  safety:
    level: S1
    side_effects: []
    approval_required_for: []
    handles_pii: false
    data_retention: none
  limits:
    max_steps: 15
    timeout_seconds: 120
    max_cost_usd: 0.08
  evals:
    suite: evals/eval.yaml
    targets: { pass_rate: 0.9 }
  exports: [python, typescript, mcp-server, a2a-card, agent-skill, subagent]
  locales: [en]
